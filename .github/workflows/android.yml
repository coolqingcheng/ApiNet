name: Android APK
on:
  workflow_dispatch:
    inputs:
      version:
        description: SemVer version
        required: true
        default: 0.1.4
  workflow_call:
    inputs:
      version:
        type: string
        required: true
    secrets:
      ANDROID_KEYSTORE_BASE64:
        required: true
      ANDROID_SIGN_PASSWORD:
        required: true
permissions:
  contents: read
jobs:
  package:
    strategy:
      fail-fast: false
      matrix:
        rid: [android-arm64, android-x64]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: android-actions/setup-android@v3
        with:
          packages: 'platform-tools platforms;android-36 build-tools;36.0.0'
      - run: dotnet workload install android --skip-manifest-update
      - name: Build signed APK
        shell: pwsh
        env:
          APINET_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          APINET_SIGN_PASSWORD: ${{ secrets.ANDROID_SIGN_PASSWORD }}
          APINET_ANDROID_RID: ${{ matrix.rid }}
          APINET_RELEASE_VERSION: ${{ inputs.version }}
        run: |
          $keyStorePath = Join-Path $env:RUNNER_TEMP 'apinet-android.keystore'
          [IO.File]::WriteAllBytes($keyStorePath, [Convert]::FromBase64String($env:APINET_KEYSTORE_BASE64))
          try { ./scripts/publish-android.ps1 -Rid $env:APINET_ANDROID_RID -Version $env:APINET_RELEASE_VERSION -KeyStore $keyStorePath }
          finally { Remove-Item -LiteralPath $keyStorePath -Force }
      - name: Enable KVM
        if: matrix.rid == 'android-x64'
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Install and launch on Android emulator
        if: matrix.rid == 'android-x64'
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: bash ./scripts/test-android.sh
      - uses: actions/upload-artifact@v4
        with:
          name: ApiNet-${{ matrix.rid }}
          path: artifacts/releases/${{ matrix.rid }}
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always() && matrix.rid == 'android-x64'
        with:
          name: Android-smoke-test
          path: artifacts/android-smoke
